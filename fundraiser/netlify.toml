[build]
  publish = "public"
  command = "echo ready"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/donate/:slug"
  to = "/player.html"
  status = 200

[[redirects]]
  from = "/sponsor"
  to = "/sponsor.html"
  status = 200

# Old addresses from before the home page moved to mhsladybroncos.com
[[redirects]]
  from = "/p/:slug"
  to = "/donate/:slug"
  status = 301

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/sponsors"
  to = "/sponsor"
  status = 301

[[redirects]]
  from = "/sponsor-report/*"
  to = "/sponsor-report.html"
  status = 200

[[redirects]]
  from = "/coach"
  to = "/coach.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
