[build]
  publish = "public"
  command = "echo ready"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/donate/:slug"
  to = "/player.html"
  status = 200

[[redirects]]
  from = "/sponsor"
  to = "/sponsor.html"
  status = 200

# Old addresses from before the home page moved to mhsladybroncos.com
[[redirects]]
  from = "/p/:slug"
  to = "/donate/:slug"
  status = 301

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/sponsors"
  to = "/sponsor"
  status = 301

[[redirects]]
  from = "/sponsor-report/*"
  to = "/sponsor-report.html"
  status = 200

[[redirects]]
  from = "/coach"
  to = "/coach.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/players"
  to = "/players.html"
  status = 200

# Athlete Monitor is its own Netlify site, served here under one address.
# The MHS Secret Binder is served by netlify/functions/binder.mts behind the team code (BINDER_CODE).
# Athlete Monitor uses page relative paths, so its files and /api calls stay inside /athletemonitor/.
# Netlify matches /athletemonitor and /athletemonitor/ with one rule, so the app adds the
# trailing slash itself when it is opened without one.
[[redirects]]
  from = "/athletemonitor/*"
  to = "https://athletemonitor.netlify.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    Cross-Origin-Opener-Policy = "same-origin"

# Private areas stay out of search results.
[[headers]]
  for = "/coach*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/portal*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sponsor-report/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
